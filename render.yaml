# Render Blueprint: free web service. The database lives on Neon (free, doesn't expire).
# In Render: New → Blueprint → pick this repo. It will ask for the two secret values below.
services:
  - type: web
    name: paisa-os
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit   # redeploy on every push to main (replaces the deprecated autoDeploy)
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false        # paste your Neon connection string (direct, not pooled)
      - key: APP_SECRET
        generateValue: true  # Render generates a random secret once; never change it afterwards
      - key: DB_POOL_MAX
        value: "5"
