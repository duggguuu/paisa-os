# Hourly alarm for Paisa: wakes the app (the free server sleeps) so it can send due reminders and
# auto-log due bills. Needs two repository secrets (Settings → Secrets and variables → Actions):
#   PAISA_URL       your app's address, e.g. https://paisa-os-ab12.onrender.com
#   PAISA_CRON_KEY  copy it from the app: Settings → Notifications → How → Copy key
# It only calls your own app; no data passes through GitHub.
name: Reminders

on:
  schedule:
    - cron: '30 * * * *'   # every hour at :30 UTC = :00 India time
  workflow_dispatch:        # "Run workflow" button, to test

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake Paisa and send what's due
        env:
          PAISA_URL: ${{ secrets.PAISA_URL }}
          PAISA_CRON_KEY: ${{ secrets.PAISA_CRON_KEY }}
        run: |
          if [ -z "$PAISA_URL" ] || [ -z "$PAISA_CRON_KEY" ]; then
            echo "::warning::Add the PAISA_URL and PAISA_CRON_KEY secrets to turn reminders on."; exit 0
          fi
          for attempt in 1 2 3 4; do
            if curl -fsS --max-time 100 -X POST -H "x-cron-key: $PAISA_CRON_KEY" "${PAISA_URL%/}/api/cron/tick" -o /dev/null; then
              echo "Done (attempt $attempt)"; exit 0
            fi
            echo "App still waking up; retrying in 20s"; sleep 20
          done
          echo "::error::Couldn't reach the app"; exit 1
